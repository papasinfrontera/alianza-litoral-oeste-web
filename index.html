(() => {
  const frames=[...document.querySelectorAll('.hero-frame img')];
  const sectors=['Turismo','Agricultura','Pesca','Construcción','Recursos'];
  const titles=['Turismo que conecta naturaleza y comunidad.','La tierra produce. La Alianza conecta oportunidades.','El mar sostiene nuestras comunidades.','Construimos espacios para crecer juntos.','Agua y energía para impulsar el territorio.'];
  const copy=document.querySelector('.slide-copy'); let index=0, timer;
  const show=(next)=>{index=(next+frames.length)%frames.length;frames.forEach((image,i)=>{image.classList.toggle('active',i===index);image.setAttribute('aria-hidden',String(i!==index));image.alt=i===index?image.alt||sectors[i]:''});document.querySelectorAll('.carousel-dots button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));if(copy){copy.querySelector('span').textContent=String(index+1).padStart(2,'0')+' / 05 · '+sectors[index];copy.querySelector('h2').textContent=titles[index];}};
  const restart=()=>{clearInterval(timer);timer=setInterval(()=>show(index+1),6000)};
  document.querySelectorAll('.carousel-dots button').forEach((button,i)=>button.addEventListener('click',()=>{show(i);restart()}));
  const arrows=document.querySelectorAll('.carousel-arrow');arrows[0]?.addEventListener('click',()=>{show(index-1);restart()});arrows[1]?.addEventListener('click',()=>{show(index+1);restart()});restart();
  const menu=document.querySelector('.app-menu'), overlay=document.querySelector('.menu-overlay'), toggle=document.querySelector('.menu-toggle');
  const close=()=>{menu?.classList.remove('is-open');overlay?.classList.remove('is-open')};
  toggle?.addEventListener('click',()=>{menu?.classList.add('is-open');overlay?.classList.add('is-open')});overlay?.addEventListener('click',close);menu?.querySelectorAll('a,button').forEach(el=>el.addEventListener('click',close));
})();
